name: Bootstrap dependency lock on hosted Ubuntu
on:
  push:
    branches: [research-hub-v1]
    paths: ['package.json', '.github/workflows/bootstrap-lock.yml']
permissions: {contents: read}
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24, package-manager-cache: false}
      - run: npm install --package-lock-only --ignore-scripts --no-fund
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: reviewed-lock, path: package-lock.json, retention-days: 3}
