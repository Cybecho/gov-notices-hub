name: Hub review on hosted Ubuntu
on: [pull_request]
permissions: {contents: read}
concurrency: {group: "hub-pr-${{ github.ref }}", cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck && npm test && npm run validate && npm run build
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
